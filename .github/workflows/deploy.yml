# Deploys the 3D flat to Netlify on every push to main (and on demand from the Actions tab).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN  personal access token from app.netlify.com/user/applications
#   NETLIFY_SITE_ID     Site configuration -> Site details -> Site ID
name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: netlify-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: mkdir site && cp index.html themes.html site/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir site --message "${{ github.sha }}"
