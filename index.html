<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>13th Floor 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #1b1d22; font-family: system-ui, sans-serif; }
  .label { color: #fff; font-size: 12px; text-align: center; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .label small { display: block; opacity: .75; font-size: 10px; }
  :root { --bg: rgba(22,24,29,.86); --line: rgba(255,255,255,.08); --text: #ece9e3; --muted: #a39d93; --accent: #c9a45c; }
  #panel { position: fixed; top: 16px; left: 16px; width: 272px; max-height: calc(100vh - 32px); overflow: auto;
    background: var(--bg); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px;
    color: var(--text); font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #panel header b { font-size: 14px; letter-spacing: .2px; }
  #panel header small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  #panel section { padding: 10px 16px 6px; border-bottom: 1px solid var(--line); }
  #panel h3 { margin: 2px 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .row > span { flex: 1; }
  #panel button, #panel select { font: inherit; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #panel button:hover, #panel select:hover { background: rgba(255,255,255,.13); }
  #panel button.primary { background: var(--accent); color: #1c1a16; border-color: transparent; font-weight: 600; }
  #panel select { width: 100%; }
  #panel option { background: #22252b; }
  .btns { gap: 8px; } .btns button { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0 !important; border-radius: 0 !important; padding: 5px 12px !important; }
  .seg button.on { background: var(--accent) !important; color: #1c1a16 !important; font-weight: 600; }
  .switch { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: #4a4d55; position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch:checked { background: var(--accent); } .switch:checked::after { left: 17px; }
  .switch:focus-visible, #panel button:focus-visible, #panel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel footer { padding: 10px 16px 14px; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
  kbd { font: 11px ui-monospace, monospace; background: rgba(255,255,255,.1); border-radius: 4px; padding: 0 5px; color: var(--text); }
  #expand { position: fixed; top: 16px; left: 16px; font: 13px system-ui; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; backdrop-filter: blur(12px); }
  #walkHint[hidden] { display: none !important; }
  #joy { position: fixed; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%;
    background: rgba(22,24,29,.35); border: 2px solid rgba(255,255,255,.35); touch-action: none; z-index: 6; }
  #joyKnob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.75); }
  #joy[hidden] { display: none !important; }
  canvas { touch-action: none; }
  @media (max-width: 520px) { #panel { width: calc(100vw - 32px); max-height: 60vh; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.10.3/dist/N8AO.js"
} }
</script>
</head>
<body>
<div id="panel">
  <header>
    <div><b>13th Floor · Dadar</b><small>3 BHK · refuge floor · 48 m up</small></div>
    <a href="themes.html" target="_blank" rel="noopener" title="Choose a colour theme" style="margin-left:auto;margin-right:8px;color:var(--text);text-decoration:none;font-size:18px">🎨</a><button id="collapse" title="Hide controls" aria-label="Hide controls">‹</button>
  </header>
  <section>
    <h3>View</h3>
    <div class="row btns"><button id="walkBtn" class="primary">Walk inside</button><button id="resetBtn">Reset view</button></div>
    <div class="row"><span>Drag to</span><div class="seg" id="dragSeg"><button data-v="rotate" class="on">Rotate</button><button data-v="pan">Move</button></div></div>
    <div class="row"><span>Zoom</span><div class="seg"><button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button></div></div>
    <label class="row"><span>Room labels</span><input type="checkbox" class="switch" id="labelsT" checked></label>
    <label class="row"><span>Full-height walls</span><input type="checkbox" class="switch" id="wallsT" checked></label>
    <label class="row"><span>Floors above</span><input type="checkbox" class="switch" id="upperT"></label>
  </section>
  <section>
    <h3>Interior</h3>
    <label class="row"><span>Furnished</span><input type="checkbox" class="switch" id="furnT" checked></label>
    <label class="row"><span>Living room v2</span><input type="checkbox" class="switch" id="v2T"></label>
    <label class="row"><span>Doors open</span><input type="checkbox" class="switch" id="doorsT" checked></label>
    <label class="row"><span>Windows open</span><input type="checkbox" class="switch" id="windowsT"></label>
    <label class="row"><span>Sofa-cum-bed as bed</span><input type="checkbox" class="switch" id="bedT"></label>
    <label class="row"><span>Drying racks lowered</span><input type="checkbox" class="switch" id="rackT"></label>
    <label class="row"><span>Bedroom sheer blinds down</span><input type="checkbox" class="switch" id="blindT"></label>
    <div class="row"><span>Kitchen finish</span><select id="kfin" style="width:auto"><option value="cloud" selected>Cloud Dancer</option><option value="charcoal">Charcoal & walnut</option><option value="sage">Sage & brass</option><option value="greige">Greige & white</option></select></div>
    <label class="row"><span>Kitchen drawers open</span><input type="checkbox" class="switch" id="kdrT"></label>
    <label class="row"><span>Imagine: refuge drying</span><input type="checkbox" class="switch" id="refugeT" checked></label>
  </section>
  <section>
    <h3>Partition</h3>
    <div class="row"><select id="ptype" aria-label="Partition type"><option value="bifold">Bi-fold · 1 track</option><option value="stack">Stacking wall · bay by TV</option><option value="pocket" selected>Pocket · into door wall</option></select></div>
    <label class="row"><span>Closed</span><input type="checkbox" class="switch" id="partT"></label>
  </section>
  <footer>
    <b style="color:var(--text)">Walk:</b> double-click a floor · mouse looks · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Esc</kbd> exit<br>
    <b style="color:var(--text)">Orbit:</b> drag · right-drag / <kbd>Shift</kbd> move · scroll zoom · arrows pan
  </footer>
</div>
<div id="walkHint" hidden style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(22,24,29,.86);color:#ece9e3;font:13px system-ui;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;z-index:5">
  <span id="walkHintText">Click the view to look around · <kbd>Esc</kbd> again to leave</span>
  <button id="exitWalk" style="font:inherit;color:#1c1a16;background:#c9a45c;border:0;border-radius:8px;padding:6px 10px;cursor:pointer">Exit walk</button>
</div>
<div id="joy" hidden aria-label="Walk joystick"><div id="joyKnob"></div></div>
<button id="expand" hidden>☰ Controls</button>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, SMAAEffect, ToneMappingEffect, ToneMappingMode } from 'postprocessing';
import { N8AOPostPass } from 'n8ao';

// All units mm. x = right, z = down the drawing (plan top = z 0).
// Positions traced from wall/window pixels of the plan at ~26.5-27.5 mm/px (checked against the
// kitchen's 3000 depth). Sizes marked (calc) are not printed on the plan.
const H = 3000, T = 150;
const HEAD = 2134;           // 7 ft: every window runs 6 in to 7 ft, only widths differ
const SILL = 152;            // 6 in above floor
const DOOR = 2100;
// hole: [offset along wall, width, bottom, top, glass]
const door = (off, w, swing) => [off, w, 0, DOOR, false, undefined, swing];   // swing: override the wall's default side
const opening = (off, w) => [off, w, 0, DOOR, false, 'open'];   // doorway without a door
const win = (off, w, sill = SILL) => [off, w, sill, HEAD, true];
const BATH = 1219;           // bathroom windows start 4 ft from the floor
const SEAT = 450;           // living windows raised to seat height for the window seat

// Free-form areas. Living: left wall comes down, turns right, meets the straight wall that
// runs down to the main door (right D1; left D1 is outside the flat, refuge side).
// Right of the main door a 2 ft wall drops down, leaving a storage niche in front of dining.
const shapes = [
  { name: 'Living', dim: '5450 x 5850', color: 0xc8a97e, label: [3600, 1800],
    floor: [[0, 0], [5450, 0], [5450, 5480], [2590, 5480], [2590, 3650], [0, 3650]],
    walls: [
      // site-measured: left window starts at the left wall's face, 18 in (457) pier between the
      // windows, 30 in (762) of wall at the right end. Windows trimmed to 2040 (~6'8") so it sums
      // to this model's 5300 inside width.
      [0, 0, 5450, 0, [win(75, 2040, SEAT), win(2572, 2040, SEAT)]],
      [0, 0, 0, 3650],                                      // leftmost wall: 12 ft
      [0, 3650, 2590, 3650],                                // turns right; 8 ft inside (site-measured)
      [2590, 3650, 2590, 5480],                             // straight wall down to the door: 6 ft (site-measured)
      [2590, 5480, 3760, 5480, [door(90, 900)]],            // main entrance
      [3760, 5480, 3760, 6030],                             // 2 ft wall right of the door
    ] },
  { name: 'Dining', dim: '3200 x 2735', color: 0xcfc6b0, label: [4600, 4700],
    floor: [[5450, 4290], [6900, 4290], [6900, 6030], [3760, 6030], [3760, 5480], [5450, 5480]],
    walls: [[3760, 6030, 6900, 6030]] },
  { name: 'Display storage', dim: 'glass cabinets, 350 deep', color: 0xcfc6b0, label: [6300, 5000], walls: [] },
];

// rectangles; holes keyed by side n|s|e|w, offset from the side's top/left end; open: sides with no wall
const rooms = [
  { name: 'Kitchen',   dim: '2700 x 3000', x: 5450, z: 0,    w: 2550, d: 3020, color: 0xd9d2c3,
    holes: { s: [opening(960, 850)], n: [win(850, 900)] } },   // open kitchen entry, no door
  { name: 'Bedroom 2', dim: '3017 x 2896 (9.9 x 9.5 ft)', x: 8000, z: 0, w: 3167, d: 3020, color: 0xa7b8c9,
    holes: { s: [door(100, 850)], n: [win(680, 2180)] } },
  { name: 'Passage',   dim: '2500 x 1200', x: 5450, z: 3020, w: 3550, d: 1270, color: 0xcfc6b0, open: 'nsew', lx: 7700 },
  { name: 'Toilet 2',  dim: '2167 x 1270 (calc)', x: 9000, z: 3020, w: 2167, d: 1270, color: 0x8fbfbf,
    holes: { w: [door(250, 750)], s: [win(1400, 550, BATH)] } },   // V1 on the part past Bedroom 1
  { name: 'Bedroom 1', dim: '3400 x 4100', x: 6900, z: 4290, w: 3400, d: 4100, color: 0xa7b8c9,
    holes: { n: [door(100, 950)], w: [door(1830, 750, -1)], e: [win(1200, 2600)] } },   // toilet 1 door (-1) opens into the toilet
  { name: 'Toilet 1',  dim: '2470 x 1350 (calc)', x: 4430, z: 6030, w: 2470, d: 1350, color: 0x8fbfbf, open: 'ne',
    holes: { s: [win(900, 600, BATH)] } },
];

const scene = new THREE.Scene();
// Good-AQI Mumbai day (~AQI 60-80): soft blue overhead fading to a warm milky haze at the horizon
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#8fb3d4'); gr.addColorStop(0.45, '#b7cddd'); gr.addColorStop(0.8, '#d9dfdf'); gr.addColorStop(1, '#e6e1d6');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = t;
}
scene.fog = new THREE.Fog(0xdcdcd5, 400000, 3800000);   // towers soften with distance
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 10, 8000000);
camera.position.set(5500, 15000, 18000);
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;       // soft shadow edges
renderer.shadowMap.autoUpdate = false;                  // perf: re-render shadows only when something changes
const refreshShadows = () => { renderer.shadowMap.needsUpdate = true; };
addEventListener('change', refreshShadows, true); addEventListener('click', refreshShadows, true);
// Realism: environment lighting (reflections on glass / steel / quartz), post-processing below does
// ambient occlusion (N8AO), bloom on the LEDs, AgX tone mapping and SMAA edges.
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: 0, pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(5500, 0, 4200);
controls.zoomToCursor = true;
controls.minDistance = 300;
controls.maxDistance = 2500000;
controls.listenToKeyEvents(window);                   // arrow keys pan
controls.keyPanSpeed = 40;
controls.update();

scene.add(new THREE.HemisphereLight(0xfff3e6, 0xc9b9a4, 0.7));   // warm sky / warm floor bounce   // warm bounce light so ceilings and undersides are not black
const sun = new THREE.DirectionalLight(0xfff4e6, 1.1);
sun.position.set(9500, 30000, 16000); sun.target.position.set(5000, 0, 4000); scene.add(sun.target);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -11000, right: 11000, top: 11000, bottom: -11000, far: 80000 });   // tight around the flat
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 20; sun.shadow.radius = 4;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2f0eb });
const glassMat = new THREE.MeshStandardMaterial({ color: 0xe3ebee, transparent: true, opacity: 0.16, roughness: 0.05 });   // near-clear, as on site
const frostMat = new THREE.MeshStandardMaterial({ color: 0xe6eef2, transparent: true, opacity: 0.75, roughness: 0.6 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, metalness: 0.5, roughness: 0.4 });   // black aluminium
const doorMat = new THREE.MeshStandardMaterial({ color: 0x3a291e, roughness: 0.55 });                  // dark wenge
const doorGroove = new THREE.MeshStandardMaterial({ color: 0x22170f, roughness: 0.7 });
const doors = [];                                     // hinged leaves, toggled open/closed
const sashes = [];                                    // sliding window panes, toggled open/closed
const walls = new THREE.Group(), labels = new THREE.Group();
scene.add(walls, labels);

function box(w, h, d, x, y, z, mat, group = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = mat !== glassMat && mat !== frostMat;
  group.add(m);
  return m;
}

function label(text, sub, x, z) {
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `${text}<small>${sub}</small>`;
  const o = new CSS2DObject(el);
  o.position.set(x, 200, z);
  labels.add(o);
}

// straight wall from (x1,z1) to (x2,z2); each hole leaves wall below/above it and optional glass inside
let wallTarget = walls;                                // group wall() builds into
// swing: +1 opens toward the wall's left-hand side (normal (uz, -ux)), -1 the other way
function wall(x1, z1, x2, z2, holes = [], swing = 1) {
  const len = Math.hypot(x2 - x1, z2 - z1), ux = (x2 - x1) / len, uz = (z2 - z1) / len;
  const piece = (from, to, y0, y1, mat, grow = 0, t = mat === glassMat || mat === frostMat ? 20 : T) => {
    const seg = to - from, mid = from + seg / 2, h = y1 - y0;
    if (seg <= 0 || h <= 0) return;
    const m = box(seg + grow, h, t, x1 + ux * mid, y0 + h / 2, z1 + uz * mid, mat, wallTarget);
    m.rotation.y = Math.atan2(-uz, ux);
  };
  let pos = 0;
  for (const [off, w, bottom, top, glass, kind, hSwing] of [...holes].sort((a, b) => a[0] - b[0])) {
    piece(pos === 0 ? -T / 2 : pos, off, 0, H, wallMat);   // extend only at the wall's own end, never into an opening
    piece(off, off + w, 0, bottom, wallMat);
    piece(off, off + w, top, H, wallMat);
    if (!glass && top === DOOR && kind !== 'open') {
      // dark wood door: frame (jambs + head) through the wall, grooved flush leaf, black pull
      const J = 40, g = new THREE.Group();
      piece(off, off + J, 0, DOOR, doorMat, 0, T + 20); piece(off + w - J, off + w, 0, DOOR, doorMat, 0, T + 20);
      piece(off, off + w, DOOR - J, DOOR, doorMat, 0, T + 20);
      g.position.set(x1 + ux * (off + J), 0, z1 + uz * (off + J)); g.rotation.y = Math.atan2(-uz, ux);
      const leaf = new THREE.Group(); g.add(leaf);
      const lw = w - 2 * J - 6, lh = DOOR - J - 10;
      box(lw, lh, 40, lw / 2 + 3, lh / 2 + 5, 0, doorMat, leaf);
      for (let k = 1; k < 4; k++) for (const zf of [-21, 21]) box(8, lh - 200, 3, 3 + (lw * k) / 4, lh / 2 + 5, zf, doorGroove, leaf);
      for (const zf of [-45, 45]) box(20, 450, 20, lw - 70, 1050, zf, frameMat, leaf);   // black pull, both faces
      wallTarget.add(g);
      doors.push({ leaf, swing: hSwing ?? swing });
    }
    if (glass) {
      // black aluminium window: perimeter frame; tall windows get fixed lower panes under a transom
      // (~1/3 height) and sliding upper sashes with interlocking double mullions. Bathroom windows
      // (high sill) are a simple 2-pane slider in frosted glass.
      const F = 50, DP = 70, hgt = top - bottom, tall = hgt > 1200, frosted = bottom >= 1200;
      const gm = frosted ? frostMat : glassMat;
      piece(off, off + F, bottom, top, frameMat, 0, DP); piece(off + w - F, off + w, bottom, top, frameMat, 0, DP);
      piece(off, off + w, bottom, bottom + F, frameMat, 0, DP); piece(off, off + w, top - F, top, frameMat, 0, DP);
      const tr = tall ? bottom + hgt * 0.33 : bottom;
      if (tall) {
        piece(off + F, off + w - F, bottom + F, tr - F / 2, gm);                   // fixed lower glass
        piece(off, off + w, tr - F / 2, tr + F / 2, frameMat, 0, DP);            // transom
      }
      const n = Math.max(2, Math.round(w / 700)), y0 = tall ? tr + F / 2 : bottom + F, y1 = top - F;
      for (let i = 0; i < n; i++) {
        const a = off + (w * i) / n, b = off + (w * (i + 1)) / n, pw = b - a, mid = (a + b) / 2;
        // 3+ panes: both outer sashes slide inward behind their neighbour (opens both sides); 2 panes: one slides
        const moves = n === 2 ? (i === 1 ? -1 : 0) : i === 0 ? 1 : i === n - 1 ? -1 : 0, zo = moves ? 18 : -18;
        if (tall && i) piece(a - 20, a + 20, bottom, tr, frameMat, 0, DP);        // fixed-pane mullion
        // upper sash: glass + its own stiles; moving sashes on the inner track, fixed ones on the outer
        const g = new THREE.Group(); g.userData.sash = true;
        g.position.set(x1 + ux * mid, (y0 + y1) / 2, z1 + uz * mid); g.rotation.y = Math.atan2(-uz, ux);
        box(pw - 20, y1 - y0, 20, 0, 0, zo, gm, g);
        for (const sx of [-1, 1]) box(30, y1 - y0, 30, sx * (pw / 2 - 15), 0, zo, frameMat, g);
        wallTarget.add(g);
        if (moves) sashes.push({ g, base: g.position.clone(), du: new THREE.Vector3(ux, 0, uz).multiplyScalar(moves * (pw - 30)) });
      }
    }
    pos = off + w;
  }
  piece(pos === 0 ? -T / 2 : pos, len + T / 2, 0, H, wallMat);
}

const floors = [];
// Floor tiles. Texture covers 2 x 2 tiles (so veins vary); ShapeGeometry UVs are plan mm.
function tileMat([tw, th], base, draw, rough) {   // tile size along x, z (mm)
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 1024, 1024);
  draw(g);
  g.fillStyle = 'rgba(150,140,125,0.55)';             // grout lines
  for (const p of [0, 511]) { g.fillRect(p, 0, 3, 1024); g.fillRect(0, p, 1024, 3); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / (2 * tw), 1 / (2 * th)); t.anisotropy = 8;
  return new THREE.MeshStandardMaterial({ map: t, roughness: rough, side: THREE.DoubleSide });
}
// living, bedrooms, kitchen, passage: large-format 5 ft x 2.5 ft (1524 x 762) off-white vitrified slabs,
// soft marble veining, long side east-west

  for (let i = 0; i < 22; i++) {

    const cs = new THREE.Mesh(new THREE.CylinderGeometry(28, 28, 45, 12), lea); cs.rotation.x = Math.PI / 2;

  }
  const col = new THREE.Mesh(new THREE.CylinderGeometry(28, 32, 330, 16), chrome); col.position.y = 270; g.add(col);
  const rb = (w, h, d, px, py, pz, r, tilt = 0) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), lea); m.position.set(px, py, pz); m.rotation.x = tilt; m.castShadow = true; g.add(m); };

// ---------- Laundry: ceiling pulley drying racks + sheer blinds ----------
// Family of 6: ~42 items/day (~6.3 m of rod + 2 peg hangers for smalls), bedsheets ~8 m at weekends.
// Bedroom 1 (east, morning sun): 8 rods x 2.4 m = 19 m. Bedroom 2 (north; at Dadar's ~19°N the
// June-August monsoon sun is slightly north, so it gets sun exactly when it is needed): 6 rods x 2.1 m.
// Lower to load, raise to dry near the warm ceiling air; sheer blinds keep the highway from seeing in.
const RACK_UP = 2550, RACK_DOWN = 1600, steel = mat(0xd9dadc, { metalness: 0.8, roughness: 0.3 });
const laundry = [0x7a8fa6, 0xe9e4da, 0xb5584a, 0x3f4a5c, 0xd9c7a3, 0x6f8a6a, 0xf2f2f2, 0x9a7cae, 0x2f3a4a, 0xc98a5a];
const racks = [];
const laundryIn = new THREE.Group(); furn.add(laundryIn);   // indoor racks (hidden while refuge drying is on)
// axis 'z': rods run along z (u = z, v = x); axis 'x': rods run along x
function makeRack({ axis, u1, u2, v1, v2, rods, items, pegs = 0 }) {
  const rack = new THREE.Group(); laundryIn.add(rack);
  const P = (u, v) => axis === 'z' ? [v, u] : [u, v];            // -> [x, z]
  const put = (lu, lv, h, cu, cv, y, m) => { const [x, z] = P(cu, cv); return axis === 'z' ? box(lv, h, lu, x, y, z, m, rack) : box(lu, h, lv, x, y, z, m, rack); };
  const rv = [...Array(rods)].map((_, k) => v1 + 25 + (k * (v2 - v1 - 50)) / (rods - 1));
  for (const v of rv) put(u2 - u1, 20, 20, (u1 + u2) / 2, v, 0, steel);
  for (const u of [u1, u2]) put(20, v2 - v1, 40, u, (v1 + v2) / 2, 0, steel);
  let r = 0, uc = u1 + 60, li = 0;
  for (const [wd, h] of items) {
    if (uc + wd > u2 - 60) { r++; uc = u1 + 60 + (r % 2) * 90; if (r >= rods) break; }
    put(wd, 10, h, uc + wd / 2, rv[r], -h / 2, mat(laundry[li++ % laundry.length], { roughness: 0.95 }));
    uc += wd + 70;
  }
  for (let p = 0; p < pegs; p++) {                                   // peg hangers for smalls
    const pu = p ? u2 - 400 : u1 + 400, pv = rv[rods - 1] - 180;
    put(360, 360, 12, pu, pv, -260, steel); put(6, 6, 250, pu, pv, -130, steel);
    for (let a = 0; a < 12; a++) put(110, 8, 160 + (a % 3) * 40, pu + Math.sin(a / 12 * 6.283) * 150, pv + Math.cos(a / 12 * 6.283) * 150, -340 - (a % 3) * 20, mat(laundry[(a + 3) % laundry.length], { roughness: 0.95 }));
  }
  const corners = [[u1, v1 + 40], [u1, v2 - 40], [u2, v1 + 40], [u2, v2 - 40]].map(([u, v]) => P(u, v));
  const ropes = corners.map(([x, z]) => box(8, 1, 8, x, 0, z, steel, laundryIn));
  for (const [x, z] of corners) box(60, 40, 60, x, 2980, z, steel, laundryIn);   // ceiling pulleys
  racks.push({ rack, ropes });
}
const dayLoad = [];
for (let p = 0; p < 6; p++) dayLoad.push([280, 620], [320, 560], p % 2 ? [500, 650] : [260, 520]);
makeRack({ axis: 'z', u1: 5650, u2: 8050, v1: 9100, v2: 10150, rods: 8, items: dayLoad, pegs: 2 });            // bedroom 1
makeRack({ axis: 'x', u1: 8750, u2: 10250, v1: 150, v2: 900, rods: 6, items: [[1300, 900], [1300, 900], [500, 650], [500, 650], [280, 620], [320, 560]] });   // bedroom 2: bedsheets + towels
function setRack(down) {
  for (const { rack, ropes } of racks) {
    rack.position.y = down ? RACK_DOWN : RACK_UP;
    const h = 2980 - rack.position.y;
    ropes.forEach(r => { r.scale.y = h; r.position.y = rack.position.y + h / 2; });
  }
}

  const visit = o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(apply); };
  [furn, walls, ceilGroup].forEach(g => g.traverse(visit)); floors.forEach(visit);
  sun.color.copy(light).lerp(new THREE.Color(0xffffff), 0.6);
}
setKitchenFinish('cloud');
// Balance for the environment light: soften env reflections on everything, and push emissive
// light sources (LEDs, jali, downlights, lamps) above the bloom threshold so only they glow.
scene.traverse(o => {
  if (!o.isMesh) return;
  for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
    if (m.userData.balanced) continue; m.userData.balanced = true;
    if ('envMapIntensity' in m) m.envMapIntensity = 0.45;
    if (m.emissive && m.emissive.getHex() && m.emissiveIntensity > 0) m.emissiveIntensity *= 2.6;
  }
});
// ---- perf: merge static meshes by material (thousands of draw calls -> a few hundred) ----
// Anything moved or toggled on its own is kept as-is; groups (doors, sashes, chairs, partition panels,
// v1/v2, racks...) are merged inside themselves, so group toggles still work.
{
  const keep = new Set([...floors, ...sofaOpen, ...sofaShut, ...tvParts, ...seatV1, ...(window.ledgeParts || []), ...blinds,
    ...racks.flatMap(r => r.ropes)]);
  const keepMat = new Set([K.base, K.upper, K.gola, K.fglass, K.quartz]);   // kitchen finish switch edits these
  const canon = new Map();
  const keyOf = m => [m.type, m.color && m.color.getHexString(), m.roughness, m.metalness, m.transparent, m.opacity, m.side,
    m.emissive && m.emissive.getHexString(), m.emissiveIntensity, m.map ? m.map.uuid : '', m.envMapIntensity].join('|');
  const canonical = m => { if (keepMat.has(m)) return m; const k = keyOf(m); if (!canon.has(k)) canon.set(k, m); return canon.get(k); };
  const prep = c => {
    c.updateMatrix();
    let g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();
    g.applyMatrix4(c.matrix);
    for (const n of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(n)) g.deleteAttribute(n);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    g.clearGroups(); return g;
  };
  let before = 0, after = 0;
  const visit = grp => {
    const buckets = new Map();
    for (const c of [...grp.children]) {
      if (!c.isMesh) { if (c.children && c.children.length) visit(c); continue; }
      before++;
      if (c.isInstancedMesh || keep.has(c) || Array.isArray(c.material) || !c.visible || c.children.length) { after++; continue; }
      const mt = canonical(c.material); c.material = mt;
      if (!buckets.has(mt)) buckets.set(mt, []); buckets.get(mt).push(c);
    }
    for (const [mt, list] of buckets) {
      if (list.length < 2) { after++; continue; }
      const merged = mergeGeometries(list.map(prep));
      if (!merged) { after += list.length; continue; }
      const mesh = new THREE.Mesh(merged, mt);
      mesh.castShadow = list.some(c => c.castShadow); mesh.receiveShadow = list.some(c => c.receiveShadow);
      list.forEach(c => grp.remove(c)); grp.add(mesh); after++;
    }
  };
  visit(scene);
  console.log(`[perf] meshes ${before} -> ${after}`);
  refreshShadows();
}
// ---- post-processing: AO -> bloom + AgX tone mapping + SMAA ----
const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
composer.addPass(new RenderPass(scene, camera));
const ao = new N8AOPostPass(scene, camera, innerWidth, innerHeight);
Object.assign(ao.configuration, { aoRadius: 450, distanceFalloff: 1.2, intensity: 2.5, halfRes: true, depthAwareUpsampling: true, color: new THREE.Color(0x201a14) });
composer.addPass(ao);
composer.addPass(new EffectPass(camera,
  new BloomEffect({ luminanceThreshold: 1.0, luminanceSmoothing: 0.08, intensity: 0.55, mipmapBlur: true }),   // only real light sources glow
  new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC }),   // ACES: warmer, truer colours than AgX (Neutral needs three r162+)
  new SMAAEffect()));

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (walking) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    walk.moveForward((f - joy.y) * SPEED * dt); walk.moveRight((r + joy.x) * SPEED * dt);   // keys + touch joystick
  } else controls.update();
  for (const f of tickers) f(dt);
  composer.render(dt); labelRenderer.render(scene, camera);
});
</script>
